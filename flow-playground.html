<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squid Flow =&gt; Playground - AgentSquid</title>
  <meta name="description" content="Try Squid Flow route expressions and see canonical routes, branch breakdowns, and expanded execution forms." />
  <link rel="icon" type="image/png" href="agent_squid_400.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" />
  <style>
    :root {
      --bg: #0b0b10;
      --surface: #12121a;
      --ink: #f1ece4;
      --muted: #aaa59d;
      --dim: #706c66;
      --line: #252534;
      --accent: #f07040;
      --accent-2: #77c6b3;
      --font: 'Rubik', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(180deg, rgba(240, 112, 64, 0.06), transparent 320px), var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: var(--accent-2); }

    .nav {
      align-items: center;
      background: rgba(11, 11, 16, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      padding: 0.9rem 2.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      align-items: center;
      color: var(--ink);
      display: flex;
      gap: 0.65rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand img {
      background: radial-gradient(circle at 50% 45%, rgba(245, 160, 96, 0.22) 0%, rgba(208, 106, 58, 0.12) 60%, rgba(208, 106, 58, 0.04) 100%);
      border: 2px solid rgba(240, 112, 64, 0.5);
      border-radius: 50%;
      height: 34px;
      object-fit: cover;
      transform: scale(1.08);
      width: 34px;
    }

    .brand span { color: var(--accent); }

    .nav-links { align-items: center; display: flex; gap: 1rem; }
    .nav-links a { color: var(--muted); font-size: 0.82rem; font-weight: 600; text-decoration: none; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-links .install { background: var(--accent); border-radius: 7px; color: #fff; padding: 0.48rem 0.85rem; }
    .mobile-page-title { display: none; }
    .nav-burger { display: none; }

    .footer { border-top: 1px solid var(--line); color: var(--dim); padding: 2rem 2.5rem; text-align: center; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 0.75rem; }
    .footer a { color: var(--muted); font-size: 0.86rem; text-decoration: none; }
    .footer a:hover { color: var(--accent-2); }

    @media (max-width: 680px) {
      .nav { padding: 0.8rem 1rem; position: relative; }
      .mobile-page-title { display: inline-block; font-size: 0.85rem; font-weight: 700; margin-right: auto; }
      .nav-burger { align-items: center; background: transparent; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; color: inherit; cursor: pointer; display: inline-flex; flex: 0 0 auto; height: 32px; justify-content: center; padding: 0; width: 32px; }
      .nav-links { align-items: stretch; background: #15151f; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); display: none; flex-direction: column; gap: 0.15rem; min-width: 160px; padding: 0.5rem; position: absolute; right: 1rem; top: calc(100% + 6px); z-index: 30; }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 0.6rem 0.7rem; }
    }
  </style>
</head>
<body>
  <!-- INCLUDE header:playground -->

  <!-- INCLUDE squid-flow-playground -->

  <!-- INCLUDE footer:playground -->
  <script src="nav-toggle.js"></script>
</body>
</html>
